name: Test and Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Run Fastify Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-Check TypeScript
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test

  docker-build:
    name: Build production images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The same build davhi runs on deploy: it compiles and tests the API and
      # builds the portal into the Caddy image. A PR that breaks it would never
      # deploy, so catch that here before it merges.
      - name: Build images
        # The build doesn't use these, but Compose won't load the file without them
        env:
          PORTAL_USER: ci
          PORTAL_PASSWORD_HASH: ci
          PERFORMER_TOKEN: ci
        run: |
          cp .env.example .env
          docker compose build
